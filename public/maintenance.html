<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta http-equiv="refresh" content="30" />
  <title>Royal Traders — Under Maintenance</title>
  <meta name="robots" content="noindex" />
  <style>
    :root {
      color-scheme: light;
      --bg: #faf9f7;
      --surface: #ffffff;
      --border: #e3e2e0;
      --text: #1a1c1b;
      --text-muted: #6b5f5e;
      --primary: #551b1c;
      --primary-light: #ffb3b1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      padding: 24px;
    }

    main {
      width: 100%;
      max-width: 30rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 48px 32px;
      text-align: center;
      box-shadow: 0 12px 32px rgba(26, 20, 20, 0.06);
    }

    .brand-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 24px;
      color: var(--primary);
    }

    .brand-mark svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    h1 {
      margin: 0 0 12px;
      font-size: 1.5rem;
      line-height: 1.3;
      color: var(--primary);
    }

    p {
      margin: 0 0 8px;
      font-size: 1rem;
      line-height: 1.6;
      color: var(--text-muted);
    }

    .eyebrow {
      display: inline-block;
      margin-bottom: 16px;
      padding: 4px 12px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--primary) 10%, transparent);
      color: var(--primary);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .contact {
      margin-top: 28px;
      padding-top: 20px;
      border-top: 1px solid var(--border);
      font-size: 0.9rem;
    }

    .contact a {
      color: var(--primary);
      text-decoration: none;
      font-weight: 600;
    }

    .contact a:hover,
    .contact a:focus-visible {
      text-decoration: underline;
    }

    .spinner {
      width: 20px;
      height: 20px;
      margin: 20px auto 0;
      border: 2.5px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .spinner {
        animation: none;
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
</head>
